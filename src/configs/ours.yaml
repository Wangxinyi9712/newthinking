data:
  dataset_name: brats2023
  dim: 3d
  split_file: data_splits/brats_split.json

  spatial_size: [96, 96, 96]
  crop_size: [96, 96, 96]

  batch_size: 1
  num_workers: 0
  pin_memory: false

  minority_oversample: false
  minority_oversample_power: 1.5

model:
  name: HybridUNet
  in_channels: 4
  out_channels: 1
  channels: [16, 32, 64, 128]
  use_transformer: false

train:
  lr: 0.0001
  min_lr: 0.000001
  epochs: 200
  seed: [0, 1, 2]

  use_amp: true
  grad_clip: 1.0
  ema_momentum: 0.99

  max_train_steps: 0
  max_val_batches: 0
  log_every: 10

loss:
  group_name: Ours
  baseline_method: pde_sdf_ot_unimatch

  use_unlabeled: true
  use_strong_consistency: true
  use_frequency_filter: false

  lambda_unsup: 0.4
  lambda_spec: 0.0
  lambda_proto: 0.0

  use_pde_refine: true
  pde_steps: 3
  pde_tau: 0.15
  pde_beta: 4.0
  pde_kappa: 0.2
  pde_smooth_kernel: 3

  use_sdf_loss: true
  lambda_sdf: 0.05
  sdf_max_dist: 20.0
  sdf_tau: 2.0

  use_phase_loss: true
  lambda_phase: 0.005
  phase_epsilon: 1.0

  use_ot_loss: true
  lambda_ot: 0.02
  ot_mode: volume

  confidence_threshold: 0.6
  reliability_temperature: 1.0

  strong_noise_std: 0.03
  strong_intensity_scale: 0.20
  strong_dropout_prob: 0.10
  unimatch_num_strong: 2

inference:
  threshold: 0.5
  use_teacher_ema: true

log:
  out_dir: runs/ours
  ckpt_path: runs/ours/seed_0/best.pt