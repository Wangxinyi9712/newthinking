data:
  dataset_name: brats2023
  dim: 3d
  split_file: data_splits/brats_split.json

  spatial_size: [96, 96, 96]
  crop_size: [96, 96, 96]

  batch_size: 1
  num_workers: 0
  pin_memory: false

  minority_oversample: false
  minority_oversample_power: 1.5

model:
  name: HybridUNet
  in_channels: 4
  out_channels: 1
  channels: [16, 32, 64, 128]
  use_transformer: false

train:
  lr: 0.0001
  min_lr: 0.000001
  epochs: 200
  seed: [0, 1, 2]

  use_amp: true
  grad_clip: 1.0
  ema_momentum: 0.99

  max_train_steps: 0
  max_val_batches: 0
  log_every: 10

loss:
  group_name: M_unimatch_ot
  baseline_method: unimatch_ot

  use_unlabeled: true
  use_strong_consistency: true
  use_frequency_filter: false

  lambda_unsup: 0.5
  lambda_spec: 0.0
  lambda_proto: 0.0

  use_sdf_loss: false
  lambda_sdf: 0.0

  use_phase_loss: false
  lambda_phase: 0.0

  use_ot_loss: true
  lambda_ot: 0.02
  ot_mode: volume

  confidence_threshold: 0.6
  reliability_temperature: 1.0

  strong_noise_std: 0.03
  strong_intensity_scale: 0.20
  strong_dropout_prob: 0.10
  unimatch_num_strong: 2

inference:
  threshold: 0.5
  use_teacher_ema: true

log:
  out_dir: runs/cross_methods/brats_group_m_unimatch_ot
  ckpt_path: runs/cross_methods/brats_group_m_unimatch_ot/seed_0/best.pt